<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="bootstrap.min.css"><link rel="stylesheet" href="app.css"></head><body><app-root><main class="sf-landing sf-yg sf-yg-v2"><div class="sf-yg-card"><div class="sf-yg-brand"><span class="sf-yg-logo">7</span>Seven Buddies</div>
      <h1 class="sf-yg-hd">Your people.<br>Only the close ones.</h1>
      <div class="sf-yg-stack" aria-hidden="true">
        <span class="sf-yg-cir sf-yg-big" style="background:#F4C0D1;color:#72243E">A</span><span class="sf-yg-cir sf-yg-big" style="background:#FAC775;color:#633806">J</span><span class="sf-yg-cir sf-yg-big" style="background:#9FE1CB;color:#085041">M</span><span class="sf-yg-cir sf-yg-big" style="background:#CECBF6;color:#3C3489">S</span><span class="sf-yg-cir sf-yg-big" style="background:#B5D4F4;color:#0C447C">+3</span>
      </div>
      <p class="sf-yg-sub">Seven friends max. That’s what makes it real.</p>
      <div class="sf-yg-chat" aria-hidden="true">
        <span class="sf-yg-bub" style="background:#FBEAF0;color:#72243E;align-self:flex-start">you up?</span>
        <span class="sf-yg-bub" style="background:#E1F5EE;color:#085041;align-self:flex-end">always</span>
        <span class="sf-yg-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg> Private. No ads. No feed.</span>
      </div>
      
    <div class="sf-yg-mine">
      <div class="sf-yg-tile">
        <span class="sf-yg-tile-pics" aria-hidden="true"><img src="icons/friends/friend1.svg" alt="" width="26" height="26" /><img src="icons/friends/friend3.svg" alt="" width="26" height="26" /><img src="icons/friends/friend5.svg" alt="" width="26" height="26" /></span>
        <b>Your buddies</b>
        <span>Seven who get you</span>
      </div>
      <div class="sf-yg-tile">
        <span class="sf-yg-tile-pics" aria-hidden="true"><img src="icons/moods/mood1.svg" alt="" width="26" height="26" /><img src="icons/moods/mood3.svg" alt="" width="26" height="26" /></span>
        <b>Your mood</b>
        <span>Show how you feel</span>
      </div>
      <div class="sf-yg-tile">
        <span class="sf-yg-tile-pics" aria-hidden="true"><i style="background:#F4C0D1"></i><i style="background:#9FE1CB"></i><i style="background:#CECBF6"></i><i style="background:#FAC775"></i></span>
        <b>Your color</b>
        <span>Pick yours</span>
      </div>
    </div>
  </div></main></app-root></body></html>
