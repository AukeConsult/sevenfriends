<!-- the same three buttons as everywhere: only the one that is open stays on the page while it records -->
@if (!opened() || opened() === 'image') {
  <app-capture-button kind="image" [disabled]="disabled()" (captured)="got($event)" (failed)="failed.emit($event)" (openChange)="opened.set($event ? 'image' : null)" />
}
@if (!opened() || opened() === 'video') {
  <app-capture-button kind="video" [disabled]="disabled()" (captured)="got($event)" (failed)="failed.emit($event)" (openChange)="opened.set($event ? 'video' : null)" />
}
@if (!noVoice() && (!opened() || opened() === 'audio')) {
  <app-capture-button kind="audio" [disabled]="disabled()" (captured)="got($event)" (failed)="failed.emit($event)" (openChange)="opened.set($event ? 'audio' : null)" />
}
