<ng-container *transloco="let t">
  <!-- one small button in the header of the item; nothing else takes room (the result is in the button) -->
  <div class="d-flex">
    <button type="button" class="sf-bar-icon" (click)="tell()" [disabled]="state() === 'sending'" [attr.title]="state() === 'sending' ? (t('safebox.tell.sending') || 'Sending…') : (state() === 'sent' ? (t('safebox.tell.told', { friendName: friendName() }) || friendName() + ' has got a message') : (t('safebox.tell.tell', { friendName: friendName() }) || 'Tell ' + friendName() + ' about this'))" [attr.aria-label]="state() === 'sending' ? (t('safebox.tell.sending') || 'Sending…') : (state() === 'sent' ? (t('safebox.tell.told', { friendName: friendName() }) || friendName() + ' has got a message') : (t('safebox.tell.tell', { friendName: friendName() }) || 'Tell ' + friendName() + ' about this'))">
      @if (state() === 'sent') {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /><path d="M9 10.5l2 2 4-4" /></svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
      }
      
    </button>
  </div>
  @if (error()) { <div class="alert alert-danger m-0" role="alert">{{ error() }}</div> }
</ng-container>
