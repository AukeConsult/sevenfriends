@if (menuOpen()) {
  <div class="menu-backdrop" (click)="closeMenu()"></div>
}

<nav class="banner" aria-label="Main">
  <a class="item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onHome()">
    <span class="icon" aria-hidden="true">🏠</span>
    <span class="text">Home</span>
  </a>
  <a class="item" routerLink="/friends" routerLinkActive="active" (click)="closeMenu()">
    <span class="icon" aria-hidden="true">👥</span>
    <span class="text">Friends</span>
  </a>

  <div class="item-wrap">
    <button type="button" class="item" [class.active]="menuOpen() || profileActive()"
            aria-haspopup="menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
      <span class="icon" aria-hidden="true">👤</span>
      <span class="text">Profile</span>
    </button>

    @if (menuOpen()) {
      <div class="dropup" role="menu">
        <a class="entry" role="menuitem" routerLink="/profile" (click)="closeMenu()">My profile</a>
        <button type="button" class="entry danger" role="menuitem" (click)="logout()">Log out</button>
      </div>
    }
  </div>
</nav>
