<nav class="sf-menu" aria-label="Main">
  <a class="sf-menu-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onHome()">
    <span class="sf-menu-icon" aria-hidden="true">
      @switch (circleType) {
        @case ('buddies') { <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /><path d="M9 11h.01M15 11h.01M9.5 14.5c1.4 1.2 3.6 1.2 5 0" /></svg> }
        @case ('work') { <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5" /><circle cx="9" cy="10.5" r="2.4" /><path d="M5.2 16.8c.6-1.8 2-2.7 3.8-2.7s3.2.9 3.8 2.7M15 9.5h3.5M15 12.5h3.5M15 15.5h2" /></svg> }
        @case ('family') { <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10" /><path d="M12 17.5s-3-1.8-3-3.6a1.7 1.7 0 0 1 3-1 1.7 1.7 0 0 1 3 1c0 1.8-3 3.6-3 3.6z" /></svg> }
        @default { <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2" /><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" /><circle cx="17" cy="9" r="2.4" /><path d="M16.5 14.2c2.6.2 4.5 2.3 4.5 5" /></svg> }
      }
    </span>
    <span class="text">{{ circleName }}</span>
  </a>
  <a class="sf-menu-item" routerLink="/share" routerLinkActive="active">
    <span class="sf-menu-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="M8.6 10.6l6.8-4M8.6 13.4l6.8 4" /></svg></span>
    <span class="text">Share</span>
  </a>

  <a class="sf-menu-item" routerLink="/settings" routerLinkActive="active">
    <span class="sf-menu-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" /></svg></span>
    <span class="text">Settings</span>
  </a>
  <!-- TEST: remove before launch (the circles: tick the one this app is in; and the demo page of the welcome pages) -->
  <div class="sf-circle-wrap">
    @if (circlesOpen()) {
      <div class="sf-circle-pop" role="menu" aria-label="Circles">
        @for (c of circles; track c.id) {
          <button type="button" class="sf-circle-opt" role="menuitemcheckbox" [attr.aria-checked]="active.id === c.id" (click)="pick(c.id)">
            <span class="sf-circle-tick" aria-hidden="true">@if (active.id === c.id) { ✓ }</span>{{ c.label }}
          </button>
        }
        <div class="sf-menu-sep"></div>
        <a class="sf-circle-opt" routerLink="/viewwelcome" role="menuitem" (click)="circlesOpen.set(false)">Welcome pages</a>
      </div>
    }
    <button type="button" class="sf-menu-item" [class.active]="circlesOpen()" aria-haspopup="menu" [attr.aria-expanded]="circlesOpen()" (click)="circlesOpen.set(!circlesOpen())">
      <span class="sf-menu-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg></span>
      <span class="text">Circles</span>
    </button>
  </div>
</nav>
