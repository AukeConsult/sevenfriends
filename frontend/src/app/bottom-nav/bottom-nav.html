@if (menuOpen()) {
  <div class="sf-menu-backdrop" (click)="closeMenu()"></div>
}

<nav class="sf-menu" aria-label="Main">
  <a class="sf-menu-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onHome()">
    <span class="sf-menu-icon" aria-hidden="true">🏠</span>
    <span class="text">Home</span>
  </a>
  <a class="sf-menu-item" routerLink="/friends" routerLinkActive="active" (click)="closeMenu()">
    <span class="sf-menu-icon" aria-hidden="true">👥</span>
    <span class="text">Friends</span>
  </a>

  <div class="sf-menu-wrap">
    <button type="button" class="sf-menu-item" [class.active]="menuOpen() || profileActive()"
            aria-haspopup="menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
      <span class="sf-menu-icon" aria-hidden="true">👤</span>
      <span class="text">Me</span>
    </button>

    @if (menuOpen()) {
      <div class="sf-dropup" role="menu">
        <a class="sf-dropup-entry" role="menuitem" routerLink="/profile" (click)="closeMenu()">My profile</a>
        <a class="sf-dropup-entry" role="menuitem" routerLink="/sound-and-notifications" (click)="closeMenu()">Sound and notifications</a>
        <a class="sf-dropup-entry" role="menuitem" routerLink="/install-app" (click)="closeMenu()">Install the app</a>
        <button type="button" class="sf-dropup-entry sf-danger" role="menuitem" (click)="logout()">Log out</button>
      </div>
    }
  </div>
</nav>
