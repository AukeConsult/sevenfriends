<ng-container *transloco="let t">
<app-page-bar [title]="t('settingsShell.settings') || 'Settings'" />
<nav class="sf-tabs" [attr.aria-label]="t('settingsShell.settings') || 'Settings'">
  @for (tab of tabs; track tab.path) {
    @if (!tab.browserOnly || !install.native) {
      <a class="sf-tab" [routerLink]="['/settings', tab.path]" [class.active]="on(tab)" [attr.aria-current]="on(tab) ? 'page' : null">{{ tab.label }}</a>
    }
  }
</nav>
<router-outlet />
</ng-container>
