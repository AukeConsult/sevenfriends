<div class="sf-back-row">
  <button type="button" class="btn btn-light" (click)="back()" aria-label="Back">‹ Back</button>
</div>
<div class="sf-page-head">
  <h1>{{ file()?.name ?? 'Image, video or audio' }}</h1>
</div>

<main class="sf-viewer">
  @if (file(); as shown) {
    @if (isAudio(shown)) {
      <audio [src]="shown.url" controls autoplay [attr.aria-label]="shown.name ?? 'Audio'"></audio>
    } @else if (isVideo(shown)) {
      <video [src]="shown.url" controls autoplay playsinline [attr.aria-label]="shown.name ?? 'Video'"></video>
    } @else {
      <img [src]="shown.url" [alt]="shown.name ?? 'Image'" />
    }
    <p class="sf-hint text-center m-0">{{ shown.type }} · {{ formatBytes(shown.bytes) }}</p>
    <a class="btn btn-primary align-self-center" [href]="shown.url" [download]="saveName(shown)">Download</a>
  } @else if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  } @else {
    <p class="sf-hint-center">Loading…</p>
  }
</main>
