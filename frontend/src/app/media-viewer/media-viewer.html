<header class="sf-bar">
  <button type="button" class="sf-back border-0 bg-transparent" (click)="back()" aria-label="Back">‹</button>
  <h1 class="sf-bar-title">{{ file()?.name ?? 'Image or video' }}</h1>
</header>

<main class="sf-viewer">
  @if (file(); as shown) {
    @if (isVideo(shown)) {
      <video [src]="shown.url" controls autoplay playsinline [attr.aria-label]="shown.name ?? 'Video'"></video>
    } @else {
      <img [src]="shown.url" [alt]="shown.name ?? 'Image'" />
    }
    <p class="sf-hint text-center m-0">{{ shown.type }} · {{ formatBytes(shown.bytes) }}</p>
    <a class="btn btn-primary rounded-pill align-self-center px-4" [href]="shown.url" [download]="saveName(shown)">Download</a>
  } @else if (error()) {
    <div class="alert alert-danger py-2 m-0" role="alert">{{ error() }}</div>
  } @else {
    <p class="sf-hint-center">Loading…</p>
  }
</main>
