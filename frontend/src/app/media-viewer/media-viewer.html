<ng-container *transloco="let t">
<main class="sf-viewer">
  @if (file(); as shown) {
    @if (isVideo(shown)) {
      <video [src]="shown.url" controls autoplay playsinline [attr.aria-label]="shown.name ?? (t('mediaViewer.video') || 'Video')"></video>
    } @else {
      <div class="sf-viewer-pic" [class.sf-viewer-full]="full()">
        <img [src]="shown.url" [alt]="shown.name ?? (t('mediaViewer.image') || 'Image')" (click)="full.set(!full())" />
      </div>
      <button type="button" class="btn btn-outline-primary btn-sm align-self-center" (click)="full.set(!full())">{{ full() ? (t('mediaViewer.fitToScreen') || 'Fit to screen') : (t('mediaViewer.fullSize') || 'Full size') }}</button>
    }
    <p class="sf-hint text-center m-0">{{ shown.name ? shown.name + ' · ' : '' }}{{ shown.type }} · {{ formatBytes(shown.bytes) }}</p>
  } @else if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  } @else {
    <p class="sf-hint-center">{{ t('mediaViewer.loading') || 'Loading…' }}</p>
  }
</main>
</ng-container>
