<ng-container *transloco="let t">
<div class="sf-camera">
  <video #video autoplay playsinline muted preload="metadata" [attr.aria-label]="(t('camera.theCamera') || 'The camera')"></video>
  @if (recording()) {
    <span class="sf-rec" role="status">● {{ seconds() }} / {{ maxSeconds }} s</span>
  }
</div>
<div class="d-flex gap-2">
  <button type="button" class="btn btn-light flex-fill" [disabled]="recording()" (click)="closed.emit()">{{ t('camera.cancel') || 'Cancel' }}</button>
  @if (mode() === 'photo') {
    <button type="button" class="btn btn-primary flex-fill" [disabled]="!ready()" (click)="takePhoto()">{{ t('camera.takeThePhoto') || 'Take the photo' }}</button>
  } @else if (!recording()) {
    <button type="button" class="btn btn-primary flex-fill" (click)="startRecording()">{{ t('camera.startRecording') || 'Start recording' }}</button>
  } @else {
    <button type="button" class="btn btn-danger flex-fill" (click)="stopRecording()">{{ t('camera.stop') || 'Stop' }}</button>
  }
</div>
@if (cameras().length > 1 && !recording()) {
  <button type="button" class="btn btn-link" (click)="nextCamera()">{{ t('camera.useAnotherCamera') || 'Use another camera' }}</button>
}
</ng-container>
