<main class="sf-landing">
  <div class="sf-hero text-center">
    <div class="sf-logo sf-logo-lg">7</div>
    <h1 class="mt-3 mb-2">Seven Friends</h1>
    <p class="sf-hero-tag m-0">Stay close to the people who matter most.</p>
    <app-seat-dots />
  </div>

  <div class="sf-form-width mx-auto w-100">
    <!-- the ways to sign in without a password -->
    <div class="vstack gap-2">
      <button type="button" class="btn btn-outline-secondary w-100 gap-2" (click)="google()" [disabled]="busy()">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
      <a routerLink="/login/phone" class="btn btn-outline-secondary w-100">Continue with phone</a>
      <a routerLink="/login/email" class="btn btn-outline-secondary w-100">Email me a sign-in link</a>
    </div>

    <div class="sf-divider"><span>or use a password</span></div>

    <form class="vstack gap-2" (submit)="$event.preventDefault(); submit(email.value, password.value, name.value)">
      <input appClear #name type="text" name="name" class="form-control" placeholder="Your name (optional)"
             autocomplete="name" [hidden]="mode() === 'signin'" />
      <input #email type="email" name="email" class="form-control" placeholder="Email"
             autocomplete="email" inputmode="email" required />
      <input #password type="password" name="password" class="form-control" placeholder="Password"
             required minlength="6" [attr.autocomplete]="mode() === 'signin' ? 'current-password' : 'new-password'" />

      <button type="submit" class="btn btn-primary" [disabled]="busy()">
        {{ busy() ? 'Please wait…' : mode() === 'signin' ? 'Sign in' : 'Create account' }}
      </button>

      @if (mode() === 'signin') {
        <button type="button" class="btn btn-link" (click)="forgot(email.value)">Forgot password?</button>
      }
    </form>

    <button type="button" class="btn btn-link w-100 mt-2" (click)="toggleMode()">
      {{ mode() === 'signin' ? 'No account? Create one' : 'Have an account? Sign in' }}
    </button>

    @if (signedOutNotice(); as notice) {
      <div class="alert alert-warning mt-2 mb-0 text-center" role="alert">{{ notice }}</div>
    }
    @if (error()) {
      <div class="alert alert-danger mt-2 mb-0 text-center" role="alert">{{ error() }}</div>
    }
    @if (info()) {
      <div class="alert alert-success mt-2 mb-0 text-center" role="status">{{ info() }}</div>
    }
  </div>
</main>
