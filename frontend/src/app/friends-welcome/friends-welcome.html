<ng-container *transloco="let t">
<main class="sf-landing sf-fr sf-fr-simple">
  <div class="sf-fr-card">
    <div class="sf-fr-brand"><span class="sf-fr-logo">7</span>{{ app }}</div>
    <h1 class="sf-fr-hd" [innerHTML]="t(page.head[0]) || page.head[1]"></h1>
    <app-inviter />
    @switch (page.kind) {
      @case ('dots') {
        <div class="sf-fr-dots" aria-hidden="true">
          @for (c of dots; track c) { <span [style.background]="c"></span> }
        </div>
      }
      @case ('card') {
        <div class="sf-fr-room" aria-hidden="true">
          @if (page.name) { <div class="sf-fr-roomhead">{{ t(page.name[0]) || page.name[1] }}</div> }
          <p class="sf-fr-bubble" [innerHTML]="t(page.card![0]) || page.card![1]"></p>
        </div>
      }
      @case ('lock') {
        <div class="sf-fr-room sf-fr-lockrow" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
          <span [innerHTML]="t(page.card![0]) || page.card![1]"></span>
        </div>
      }
    }
    <p class="sf-fr-sub">{{ t(page.line[0]) || page.line[1] }}</p>
    <div class="sf-fr-end">
      <app-next-step [circle]="circle" ctaClass="sf-fr-cta" bg="var(--sf-primary)" fg="#fff" [back]="t('friendsWelcome.home') || 'Open the app'" [cta]="t('friendsWelcome.start') || 'Get started'" />
      <a class="sf-fr-fine" routerLink="/welcome/explain">{{ t('friendsWelcome.how') || 'How does it work?' }}</a>
    </div>
  </div>
</main>
</ng-container>
