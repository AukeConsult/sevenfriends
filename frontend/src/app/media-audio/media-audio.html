<span class="sf-media-audio">
  @if (src(); as url) {
    <audio [src]="url" controls autoplay (click)="stop($event)" (error)="playbackFailed()"></audio>
    @if (failed()) {
      <span class="sf-audio-info">This device cannot play this audio.</span>
    }
  } @else {
    <button type="button" class="sf-play sf-play-small" [disabled]="loading()" (click)="play($event)" aria-label="Play the audio message">
      @if (loading()) {
        <span class="sf-hint">…</span>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
      }
    </button>
    <span class="sf-audio-info">🎤 {{ failed() ? 'Could not load the audio' : info() }}</span>
  }
  <a class="sf-audio-open" [routerLink]="['/media', media().ownerId, media().objectId]" (click)="stop($event)" aria-label="Open the audio to download it">⤓</a>
</span>
