<ng-container *transloco="let t">
<span #box class="sf-media sf-media-picture" [style.--sf-ratio]="ratio()">
  @if (src(); as url) {
    <img [src]="url" [alt]="media().name ?? (t('mediaImage.image') || 'Image')" />
  } @else if (failed()) {
    <span class="sf-hint">{{ t('mediaImage.couldNotLoadThe') || 'Could not load the image' }}</span>
  } @else {
    <span class="sf-hint">{{ t('mediaImage.loading') || 'Loading…' }}</span>
  }
</span>
</ng-container>
