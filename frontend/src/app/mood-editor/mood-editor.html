<div class="card border-0 shadow-none bg-transparent" [class.sf-mood-fit]="!open()">
  <!-- closed: my mood icon and message. Tap it to open the frame and change them -->
  <button type="button" class="sf-summary" [attr.aria-expanded]="open()" aria-controls="mood-panel" [disabled]="!loaded()"
          (click)="open.set(!open())">
    @if (mood(); as current) {
      <img [src]="moodIcon(current)" [alt]="moodLabel(current)" width="28" height="28" />
    } @else {
      <span class="sf-summary-none" aria-hidden="true">+</span>
    }
    <span class="sf-summary-text">
      <span class="sf-wrap">
        @if (mood() || message()) {
          {{ moodLabel(mood()) }}{{ mood() && message() ? ' · ' : '' }}{{ message() }}
        } @else {
          Tap to say how you are
        }
      </span>
    </span>
    <span class="sf-chevron" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           [style.transform]="open() ? 'rotate(180deg)' : null"><path d="M6 9l6 6 6-6" /></svg>
    </span>
  </button>

  @if (open()) {
    <div id="mood-panel" class="card-body vstack gap-2 pt-0">
      <div class="sf-choices sf-choices-grid" role="radiogroup" aria-label="Your mood">
        <!-- no mood at all: the empty choice -->
        <button type="button" class="sf-choice" role="radio" [attr.aria-checked]="mood() === null" [class.sf-chosen]="mood() === null"
                aria-label="No mood" title="No mood" (click)="choose(null)">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M5.6 5.6l12.8 12.8" />
          </svg>
          <span class="small">No mood</span>
        </button>
        @for (m of moods; track m.id) {
          <button type="button" class="sf-choice" role="radio" [attr.aria-checked]="mood() === m.id" [class.sf-chosen]="mood() === m.id"
                  [attr.aria-label]="m.label" [title]="m.label" (click)="choose(m.id)">
            <img [src]="moodIcon(m.id)" alt="" width="36" height="36" />
            <span class="small">{{ m.label }}</span>
          </button>
        }
      </div>
      <input appClear type="text" class="form-control" maxlength="60" placeholder="A few words about how you are (optional)"
             [value]="message()" (input)="typed($any($event.target).value)" (blur)="leftField()" aria-label="Mood message" />
    </div>
  }

  @if (error()) {
    <span class="small text-danger px-3 pb-2" role="alert">{{ error() }}</span>
  }
</div>
