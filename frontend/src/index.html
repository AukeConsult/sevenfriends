<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // sevenfriends.io is the main address: the other names send people there (same path), before the app starts
    (function () {
      var main = 'sevenfriends.io', host = location.hostname;
      if (host === '7friends.io' || host === 'www.7friends.io' || host === 'www.' + main) location.replace('https://' + main + location.pathname + location.search + location.hash);
    })();
  </script>
  <script>
    // The browser's install offer can arrive before the app has started: keep it here, the install page picks it up (core/install.service.ts)
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__sfInstallOffer = e; });
  </script>
  <meta name="theme-color" content="#fde6c6">
  <script>
    // The Android app tells the page how high its status bar is (SfInsets, MainActivity.java), because the web view does not report it itself
    (function () {
      function native() {
        try {
          if (window.SfInsets) document.documentElement.style.setProperty('--sf-native-top', window.SfInsets.topDp() + 'px');
        } catch (e) { /* not the Android app */ }
      }
      native();
      window.addEventListener('resize', native);
      window.addEventListener('pageshow', native);
      setTimeout(native, 300); setTimeout(native, 1500);
    })();
  </script>
  <script>
    // The colours the person chose (Preferences): set before the first paint, so the page does not flash the light colours (core/ui-preferences.ts keeps it up to date)
    try {
      var sf = JSON.parse(localStorage.getItem('sf-ui') || '{}');
      var themes = { light: '#fde6c6', dark: '#1f2430', ocean: '#d6eaf7', forest: '#dcefd3', rose: '#fbdde3' };
      var theme = themes[sf.theme] ? sf.theme : 'light';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', themes[theme]);
      document.documentElement.style.setProperty('--sf-text-scale', String({ tiny: 0.8, small: 0.9, big: 1.15, huge: 1.35 }[sf.textSize] || 1));
      document.documentElement.style.setProperty('--sf-text-scale-phone', String({ tiny: 0.9, small: 1, big: 1.3225, huge: 1.55 }[sf.textSize] || 1.15));
    } catch (e) { /* the light colours */ }
  </script>
  <title>Seven Friends</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- the Seven Friends icon: the SVG for modern browsers, favicon.ico for the others (public/icons/sevenfriends.svg) -->
  <link rel="icon" type="image/svg+xml" href="icons/sevenfriends.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seven Friends">
  <script>
    // Bootstrap comes in two builds, left-to-right and right-to-left: the right one for a right-to-left language (core/language.service.ts changes it later when the language changes)
    (function () {
      var rtl = false;
      try { rtl = ['ar', 'he'].indexOf(JSON.parse(localStorage.getItem('sf-ui') || '{}').language) >= 0; } catch (e) {}
      var link = document.createElement('link');
      link.id = 'sf-bootstrap'; link.rel = 'stylesheet'; link.href = 'vendor/bootstrap' + (rtl ? '.rtl' : '') + '.min.css';
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
